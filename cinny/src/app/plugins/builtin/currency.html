<!DOCTYPE html>
<!--
  Diddy built-in plugin: currency converter with daily ECB rates from Frankfurter
  (https://frankfurter.dev, no API key, CORS open). Stored key "pair" = {"from","to","amount"}.
  Plugin API: docs/plugins.md (apiVersion 1, storage extension).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Currency</title>
    <style>
      :root { --fg: #1d1d1f; --muted: rgba(0, 0, 0, 0.55); --card: rgba(0, 0, 0, 0.05); --line: rgba(0, 0, 0, 0.1); --accent: #007aff; --error: #d70015; color-scheme: light; }
      :root[data-theme="dark"] { --fg: #f5f5f7; --muted: rgba(255, 255, 255, 0.6); --card: rgba(255, 255, 255, 0.08); --line: rgba(255, 255, 255, 0.14); --accent: #0a84ff; --error: #ff6961; color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: transparent; color: var(--fg); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { padding: 14px 16px 14px; display: flex; flex-direction: column; gap: 8px; }
      .row { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 4px 4px 4px 10px; }
      .row:has(#amount:focus) { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
      #amount, #result { flex: 1; min-width: 0; font: inherit; font-size: 20px; font-weight: 300; color: inherit; background: transparent; border: 0; padding: 2px 0; font-variant-numeric: tabular-nums; }
      #amount:focus { outline: none; }
      #result { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      select { font: inherit; font-weight: 600; color: inherit; background: var(--card); border: 0; border-radius: 7px; padding: 5px 6px; cursor: pointer; }
      .mid { display: flex; justify-content: center; margin: -4px 0; }
      .swap { font: inherit; color: var(--accent); background: transparent; border: 1px solid var(--line); border-radius: 999px; width: 30px; height: 30px; cursor: pointer; line-height: 1; }
      .meta { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
      .meta a { color: inherit; }
      .error { color: var(--error); margin: 0; font-size: 12px; display: flex; gap: 8px; align-items: center; }
      .error button { font: inherit; color: var(--accent); background: none; border: 0; padding: 0 2px; cursor: pointer; text-decoration: underline; }
      #line { display: none; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      [hidden] { display: none !important; }
      :root[data-layout="compact"] main { padding: 8px 10px; gap: 2px; }
      :root[data-layout="compact"] #line { display: block; }
      :root[data-layout="compact"] .row, :root[data-layout="compact"] .mid, :root[data-layout="compact"] .meta { display: none; }
    </style>
    <style id="diddy-custom-css"></style>
  </head>
  <body>
    <main id="app">
      <div id="line" aria-live="polite">…</div>
      <div class="row">
        <input id="amount" type="text" inputmode="decimal" value="100" maxlength="16" aria-label="Amount" autocomplete="off" />
        <select id="from" aria-label="From currency"></select>
      </div>
      <div class="mid"><button type="button" class="swap" id="swap" aria-label="Swap currencies" title="Swap">⇅</button></div>
      <div class="row">
        <output id="result" aria-live="polite" aria-label="Converted amount">…</output>
        <select id="to" aria-label="To currency"></select>
      </div>
      <div class="meta">
        <span id="rate"></span>
        <span>Rates: <a id="credit" href="https://frankfurter.dev/">Frankfurter</a></span>
      </div>
      <p class="error" id="error" role="alert" hidden><span id="errorText"></span><button type="button" id="retry">Retry</button></p>
    </main>

    <script>
      (() => {
        "use strict";

        const API_VERSION = 1;
        const host = window.parent;
        const embedded = host !== window;
        const root = document.documentElement;
        const $ = (id) => document.getElementById(id);
        const send = (message) => {
          if (embedded) host.postMessage(message, "*");
        };
        let locale = navigator.language || "en";
        root.dataset.theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        root.dataset.layout = "full";

        // ---- storage through Diddy (the sandbox blocks localStorage) ----------------------
        const KEY = /^[a-z0-9_.-]{1,40}$/;
        const waiting = new Map();
        let nextId = 0;
        let initDone;
        const initSeen = new Promise((resolve) => (initDone = resolve));
        const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
        async function storageGet(key) {
          if (!embedded || !KEY.test(key)) return null;
          await Promise.race([initSeen, delay(1000)]);
          return new Promise((resolve) => {
            const id = `get-${++nextId}`;
            const timer = setTimeout(() => finish(null), 2000);
            function finish(value) {
              clearTimeout(timer);
              waiting.delete(id);
              resolve(value);
            }
            waiting.set(id, { key, finish });
            send({ type: "diddy:storage:get", id, key });
          });
        }
        function storageSet(key, value) {
          if (!KEY.test(key) || typeof value !== "string" || value.length > 20000) return;
          send({ type: "diddy:storage:set", key, value });
        }

        window.addEventListener("message", (event) => {
          if (!embedded || event.source !== host) return;
          const data = event.data;
          if (!data || typeof data !== "object") return;
          if (data.type === "diddy:init") {
            if (data.apiVersion !== API_VERSION) return;
            if (data.theme === "light" || data.theme === "dark") root.dataset.theme = data.theme;
            root.dataset.layout = data.layout === "compact" ? "compact" : "full";
            $("diddy-custom-css").textContent = typeof data.customCss === "string" ? data.customCss : "";
            if (typeof data.locale === "string") {
              try {
                locale = Intl.getCanonicalLocales(data.locale)[0] || locale;
              } catch {}
            }
            initDone();
            update();
          } else if (data.type === "diddy:storage:value") {
            const entry = typeof data.id === "string" ? waiting.get(data.id) : undefined;
            if (!entry || data.key !== entry.key) return;
            if (data.value !== null && typeof data.value !== "string") return;
            entry.finish(data.value);
          }
        });

        const app = $("app");
        let lastHeight = 0;
        const reportHeight = () => {
          const height = Math.ceil(app.getBoundingClientRect().height);
          if (height !== lastHeight) {
            lastHeight = height;
            send({ type: "diddy:resize", height });
          }
        };
        new ResizeObserver(reportHeight).observe(app);

        $("credit").addEventListener("click", (event) => {
          if (!embedded) return;
          event.preventDefault();
          send({ type: "diddy:open", url: "https://frankfurter.dev/" });
        });

        // ---- converter --------------------------------------------------------------------
        const CURRENCIES = ["EUR", "USD", "GBP", "CHF", "JPY", "CAD", "AUD", "SEK", "NOK", "PLN", "CZK", "TRY"];
        for (const id of ["from", "to"]) {
          for (const code of CURRENCIES) {
            const option = document.createElement("option");
            option.value = code;
            option.textContent = code;
            $(id).append(option);
          }
        }
        $("from").value = "EUR";
        $("to").value = "USD";

        const cache = new Map(); // base -> { at, promise }
        let touched = false;
        let saveTimer = 0;
        let token = 0;

        function parseAmount(text) {
          let v = String(text).replace(/[\s'’_]/g, "");
          if (/^\d*,\d+$/.test(v) && !/^\d{1,3},\d{3}$/.test(v)) v = v.replace(",", ".");
          else v = v.replace(/,/g, "");
          if (!/^\d*\.?\d+$|^\d+\.$/.test(v)) return NaN;
          const n = Number(v);
          return n >= 0 && n <= 1e12 ? n : NaN;
        }
        const fmt = (n, options) => {
          try {
            return new Intl.NumberFormat(locale, options).format(n);
          } catch {
            return new Intl.NumberFormat("en", options).format(n);
          }
        };
        const money = (n) => (n !== 0 && Math.abs(n) < 1 ? fmt(n, { maximumSignificantDigits: 4 }) : fmt(n, { maximumFractionDigits: 2 }));

        function rates(base) {
          const hit = cache.get(base);
          if (hit && Date.now() - hit.at < 3600000) return hit.promise;
          const promise = fetch(`https://api.frankfurter.dev/v2/rates?base=${encodeURIComponent(base)}`)
            .then((response) => {
              if (!response.ok) throw new Error(`HTTP ${response.status}`);
              return response.json();
            })
            .then((data) => {
              // v2: [{ date, base, quote, rate }, ...]
              if (!Array.isArray(data) || data.length === 0) throw new Error("unexpected data");
              const rates = {};
              let date = "";
              data.forEach((item) => {
                if (item && typeof item.quote === "string" && typeof item.rate === "number") {
                  rates[item.quote] = item.rate;
                  if (!date && typeof item.date === "string") date = item.date;
                }
              });
              if (Object.keys(rates).length === 0) throw new Error("unexpected data");
              return { rates, date };
            });
          cache.set(base, { at: Date.now(), promise });
          promise.catch(() => cache.delete(base));
          return promise;
        }

        function showError(message) {
          $("errorText").textContent = message;
          $("error").hidden = !message;
        }
        function show(result, line, rateText) {
          $("result").textContent = result;
          $("line").textContent = line;
          $("rate").textContent = rateText;
        }

        async function update() {
          const my = ++token;
          const from = $("from").value;
          const to = $("to").value;
          const amount = parseAmount($("amount").value);
          $("amount").setAttribute("aria-invalid", String(Number.isNaN(amount)));
          if (Number.isNaN(amount)) {
            showError("Enter a valid amount.");
            $("retry").hidden = true;
            show("–", `– ${from} = – ${to}`, "");
            return;
          }
          let rate = 1;
          let date = "";
          if (from !== to) {
            if (!$("result").textContent || $("result").textContent === "–") show("…", "…", "");
            try {
              const data = await rates(from);
              if (my !== token) return;
              rate = data.rates[to];
              date = data.date;
              if (typeof rate !== "number" || !Number.isFinite(rate) || rate <= 0) throw new Error("no rate");
            } catch {
              if (my !== token) return;
              showError("Rates unavailable. Check your connection.");
              $("retry").hidden = false;
              show("–", `${fmt(amount, { maximumFractionDigits: 2 })} ${from} = ? ${to}`, "");
              return;
            }
          }
          showError("");
          const result = money(amount * rate);
          show(result, `${fmt(amount, { maximumFractionDigits: 2 })} ${from} = ${result} ${to}`, `1 ${from} = ${fmt(rate, { maximumFractionDigits: 4 })} ${to}${date ? ` · ${date}` : ""}`);
        }

        function changed() {
          touched = true;
          update();
          clearTimeout(saveTimer);
          saveTimer = setTimeout(() => {
            storageSet("pair", JSON.stringify({ from: $("from").value, to: $("to").value, amount: $("amount").value.slice(0, 16) }));
          }, 500);
        }

        $("amount").addEventListener("input", changed);
        $("from").addEventListener("change", changed);
        $("to").addEventListener("change", changed);
        $("swap").addEventListener("click", () => {
          const from = $("from").value;
          $("from").value = $("to").value;
          $("to").value = from;
          changed();
        });
        $("retry").addEventListener("click", () => {
          cache.clear();
          update();
        });

        // ---- start ------------------------------------------------------------------------
        send({
          type: "diddy:ready",
          apiVersion: API_VERSION,
          manifest: { name: "Currency", description: "Daily ECB rates via Frankfurter", height: 200 },
        });
        reportHeight();
        storageGet("pair").then((raw) => {
          if (!touched && typeof raw === "string") {
            try {
              const saved = JSON.parse(raw);
              if (saved && CURRENCIES.includes(saved.from) && CURRENCIES.includes(saved.to)) {
                $("from").value = saved.from;
                $("to").value = saved.to;
                if (typeof saved.amount === "string" && !Number.isNaN(parseAmount(saved.amount))) $("amount").value = saved.amount.slice(0, 16);
              }
            } catch {}
          }
          update();
        });
      })();
    </script>
  </body>
</html>
