<!DOCTYPE html>
<!--
  Diddy built-in plugin: weather from Open-Meteo (https://open-meteo.com, no API key needed).
  Based on docs/plugins/weather.html. The place is kept through Diddy's storage (key "city");
  ?city= in the address still works as an optional start value. Default: Berlin.
  Plugin API: docs/plugins.md (apiVersion 1, storage extension).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Weather</title>
    <style>
      :root { --fg: #1d1d1f; --muted: rgba(0, 0, 0, 0.55); --card: rgba(0, 0, 0, 0.05); --line: rgba(0, 0, 0, 0.1); --accent: #007aff; --error: #d70015; color-scheme: light; }
      :root[data-theme="dark"] { --fg: #f5f5f7; --muted: rgba(255, 255, 255, 0.6); --card: rgba(255, 255, 255, 0.08); --line: rgba(255, 255, 255, 0.14); --accent: #0a84ff; --error: #ff6961; color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: transparent; color: var(--fg); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
      .now { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .now > div:first-child { min-width: 0; }
      .place { font-size: 16px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .muted { color: var(--muted); font-size: 12px; }
      .temp { display: flex; align-items: center; gap: 8px; font-size: 34px; font-weight: 300; white-space: nowrap; }
      .days { display: grid; grid-template-columns: repeat(auto-fit, minmax(64px, 1fr)); gap: 8px; margin: 0; padding: 0; list-style: none; }
      .days li { background: var(--card); border-radius: 10px; padding: 8px 4px; text-align: center; font-variant-numeric: tabular-nums; }
      .days .icon { font-size: 20px; }
      .search { display: flex; gap: 8px; }
      input, button { font: inherit; color: inherit; border-radius: 8px; border: 1px solid var(--line); padding: 6px 10px; background: var(--card); }
      input { flex: 1; min-width: 0; }
      button { background: var(--accent); border-color: transparent; color: #fff; cursor: pointer; }
      button:disabled { opacity: 0.5; cursor: default; }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .error { color: var(--error); margin: 0; font-size: 13px; }
      a { color: inherit; }
      [hidden] { display: none !important; }
      /* Small card in the Diddy sidebar (diddy:init says layout: "compact"): one slim row. */
      :root[data-layout="compact"] main { padding: 6px 10px; gap: 2px; }
      :root[data-layout="compact"] .place { font-size: 13px; }
      :root[data-layout="compact"] .temp { font-size: 22px; gap: 4px; }
      :root[data-layout="compact"] #details { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      :root[data-layout="compact"] .error { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      :root[data-layout="compact"] .days, :root[data-layout="compact"] .search, :root[data-layout="compact"] .credit { display: none; }
    </style>
    <style id="diddy-custom-css"></style>
  </head>
  <body>
    <main id="app">
      <section class="now">
        <div>
          <div class="place" id="place">Loading…</div>
          <div class="muted" id="details"></div>
        </div>
        <div class="temp">
          <span id="icon" aria-hidden="true"></span><span id="temp"></span>
        </div>
      </section>
      <ol class="days" id="days" aria-label="Forecast"></ol>
      <!-- no <form>: the Diddy sandbox does not allow form submission -->
      <div class="search">
        <input id="city" type="text" placeholder="City" aria-label="City" autocomplete="off" maxlength="80" />
        <button id="go" type="button">Show</button>
      </div>
      <p class="error" id="error" role="alert" hidden></p>
      <div class="muted credit">Weather data by <a id="credit" href="https://open-meteo.com/">Open-Meteo.com</a></div>
    </main>

    <script>
      (() => {
        "use strict";

        const API_VERSION = 1;
        const host = window.parent;
        const embedded = host !== window;
        const root = document.documentElement;
        const $ = (id) => document.getElementById(id);
        // The frame has an opaque origin, so '*' is used and nothing private is ever sent.
        const send = (message) => {
          if (embedded) host.postMessage(message, "*");
        };
        let locale = navigator.language || "en";
        root.dataset.theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        root.dataset.layout = "full";

        // ---- storage through Diddy (the sandbox blocks localStorage) ----------------------
        const KEY = /^[a-z0-9_.-]{1,40}$/;
        const waiting = new Map();
        let nextId = 0;
        let initDone;
        const initSeen = new Promise((resolve) => (initDone = resolve));
        const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
        async function storageGet(key) {
          if (!embedded || !KEY.test(key)) return null;
          await Promise.race([initSeen, delay(1000)]);
          return new Promise((resolve) => {
            const id = `get-${++nextId}`;
            const timer = setTimeout(() => finish(null), 2000);
            function finish(value) {
              clearTimeout(timer);
              waiting.delete(id);
              resolve(value);
            }
            waiting.set(id, { key, finish });
            send({ type: "diddy:storage:get", id, key });
          });
        }
        function storageSet(key, value) {
          if (!KEY.test(key) || typeof value !== "string" || value.length > 20000) return;
          send({ type: "diddy:storage:set", key, value });
        }

        window.addEventListener("message", (event) => {
          if (!embedded || event.source !== host) return;
          const data = event.data;
          if (!data || typeof data !== "object") return;
          if (data.type === "diddy:init") {
            if (data.apiVersion !== API_VERSION) return; // a future Diddy may speak a newer version
            if (data.theme === "light" || data.theme === "dark") root.dataset.theme = data.theme;
            root.dataset.layout = data.layout === "compact" ? "compact" : "full";
            $("diddy-custom-css").textContent = typeof data.customCss === "string" ? data.customCss : "";
            if (typeof data.locale === "string") {
              try {
                locale = Intl.getCanonicalLocales(data.locale)[0] || locale;
              } catch {}
            }
            initDone();
            render();
          } else if (data.type === "diddy:storage:value") {
            const entry = typeof data.id === "string" ? waiting.get(data.id) : undefined;
            if (!entry || data.key !== entry.key) return;
            if (data.value !== null && typeof data.value !== "string") return;
            entry.finish(data.value);
          }
        });

        // Measure the content, not the document (the document is at least as tall as the frame).
        const app = $("app");
        let lastHeight = 0;
        const reportHeight = () => {
          const height = Math.ceil(app.getBoundingClientRect().height);
          if (height !== lastHeight) {
            lastHeight = height;
            send({ type: "diddy:resize", height });
          }
        };
        new ResizeObserver(reportHeight).observe(app);

        // Links cannot navigate out of the sandbox: ask Diddy to open them (https only).
        $("credit").addEventListener("click", (event) => {
          if (!embedded) return;
          event.preventDefault();
          send({ type: "diddy:open", url: "https://open-meteo.com/" });
        });

        // ---- weather ----------------------------------------------------------------------
        // WMO weather interpretation codes, as used by Open-Meteo
        const CODES = {
          0: ["Clear sky", "☀️"], 1: ["Mainly clear", "🌤️"], 2: ["Partly cloudy", "⛅"], 3: ["Overcast", "☁️"],
          45: ["Fog", "🌫️"], 48: ["Rime fog", "🌫️"],
          51: ["Light drizzle", "🌦️"], 53: ["Drizzle", "🌦️"], 55: ["Heavy drizzle", "🌧️"],
          56: ["Freezing drizzle", "🌧️"], 57: ["Freezing drizzle", "🌧️"],
          61: ["Light rain", "🌦️"], 63: ["Rain", "🌧️"], 65: ["Heavy rain", "🌧️"],
          66: ["Freezing rain", "🌧️"], 67: ["Freezing rain", "🌧️"],
          71: ["Light snow", "🌨️"], 73: ["Snow", "🌨️"], 75: ["Heavy snow", "❄️"], 77: ["Snow grains", "🌨️"],
          80: ["Rain showers", "🌦️"], 81: ["Rain showers", "🌧️"], 82: ["Violent showers", "⛈️"],
          85: ["Snow showers", "🌨️"], 86: ["Snow showers", "❄️"],
          95: ["Thunderstorm", "⛈️"], 96: ["Thunderstorm, hail", "⛈️"], 99: ["Thunderstorm, hail", "⛈️"],
        };
        const describe = (code) => CODES[code] || ["Unknown", "🌡️"];

        let state; // { place, weather }

        const format = (fn) => {
          try {
            return fn(locale);
          } catch {
            return fn("en");
          }
        };
        const num = (value) => (typeof value === "number" && Number.isFinite(value) ? value : NaN);
        const temp = (value) =>
          Number.isNaN(num(value)) ? "–" : `${format((l) => new Intl.NumberFormat(l, { maximumFractionDigits: 0 }).format(value))}°`;
        const weekday = (isoDate) => {
          const [y, m, d] = String(isoDate).split("-").map(Number);
          return format((l) => new Intl.DateTimeFormat(l, { weekday: "short" }).format(new Date(y, m - 1, d)));
        };

        // Only textContent is used: data from the network never becomes HTML.
        function render() {
          if (!state) return;
          const { place, weather } = state;
          const current = weather.current;
          const [text, icon] = describe(current.weather_code);
          $("place").textContent = [place.name, place.country].filter((v) => typeof v === "string" && v).join(", ");
          const wind = num(current.wind_speed_10m);
          $("details").textContent =
            `${text} · feels like ${temp(current.apparent_temperature)}` +
            (Number.isNaN(wind) ? "" : ` · wind ${Math.round(wind)} km/h`);
          $("icon").textContent = icon;
          $("temp").textContent = temp(current.temperature_2m);

          const daily = weather.daily;
          $("days").replaceChildren(
            ...daily.time.slice(0, 4).map((day, i) => {
              const li = document.createElement("li");
              const name = document.createElement("div");
              name.className = "muted";
              name.textContent = i === 0 ? "Today" : weekday(day);
              const sym = document.createElement("div");
              sym.className = "icon";
              const [dayText, dayIcon] = describe(daily.weather_code[i]);
              sym.textContent = dayIcon;
              sym.title = dayText;
              sym.setAttribute("aria-label", dayText);
              const range = document.createElement("div");
              range.textContent = `${temp(daily.temperature_2m_max[i])} / ${temp(daily.temperature_2m_min[i])}`;
              li.append(name, sym, range);
              return li;
            })
          );
        }

        const showError = (message) => {
          $("error").textContent = message;
          $("error").hidden = !message;
        };

        const getJson = async (url) => {
          const response = await fetch(url);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.json();
        };
        const isWeather = (w) =>
          w && w.current && typeof w.current === "object" && w.daily && Array.isArray(w.daily.time) &&
          ["weather_code", "temperature_2m_max", "temperature_2m_min"].every((k) => Array.isArray(w.daily[k]));

        let loadToken = 0;
        async function load(city, remember) {
          const token = ++loadToken;
          showError("");
          $("go").disabled = true;
          try {
            const geo = await getJson(
              `https://geocoding-api.open-meteo.com/v1/search?count=1&format=json&language=en&name=${encodeURIComponent(city)}`
            );
            const place = geo && Array.isArray(geo.results) ? geo.results[0] : undefined;
            if (token !== loadToken) return;
            if (!place || !Number.isFinite(place.latitude) || !Number.isFinite(place.longitude)) {
              showError(`No place called “${city}” found.`);
              if ($("place").textContent === "Loading…") $("place").textContent = "Weather";
              return;
            }
            const weather = await getJson(
              "https://api.open-meteo.com/v1/forecast" +
                `?latitude=${place.latitude}&longitude=${place.longitude}` +
                "&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m" +
                "&daily=weather_code,temperature_2m_max,temperature_2m_min" +
                "&timezone=auto&forecast_days=4"
            );
            if (token !== loadToken) return;
            if (!isWeather(weather)) throw new Error("unexpected data");
            state = { place, weather };
            if (typeof place.name === "string") {
              $("city").value = place.name;
              if (remember) storageSet("city", place.name.slice(0, 80));
            }
            render();
          } catch (error) {
            if (token !== loadToken) return;
            showError("Could not load the weather. Check your connection and try again.");
            if ($("place").textContent === "Loading…") $("place").textContent = "Weather";
          } finally {
            if (token === loadToken) $("go").disabled = false;
          }
        }

        const search = () => {
          const city = $("city").value.trim();
          if (city) load(city.slice(0, 80), true);
        };
        $("go").addEventListener("click", search);
        $("city").addEventListener("keydown", (event) => {
          if (event.key === "Enter") search();
        });

        // ---- start ------------------------------------------------------------------------
        send({
          type: "diddy:ready",
          apiVersion: API_VERSION,
          manifest: { name: "Weather", description: "Forecast by Open-Meteo", height: 280 },
        });
        reportHeight();
        storageGet("city").then((saved) => {
          if (loadToken) return; // the user already searched while we waited
          const param = new URLSearchParams(location.search).get("city");
          const city = (typeof saved === "string" && saved.trim()) || (param && param.trim()) || "Berlin";
          load(city.slice(0, 80), false);
        });
      })();
    </script>
  </body>
</html>
