name: Build iOS
# Builds the native iPhone/iPad app (ios/, SwiftUI + matrix-rust-sdk + LiveKit) and stores the
# IPA as artifact `diddy-ios`.
#
# Without secrets the IPA is unsigned. AltStore, SideStore or Sideloadly sign it with your own
# Apple ID (a free one works) when they install it. The app has no extensions, so it uses a single
# App ID of the few a free account gets.
#
# Signed build (paid Apple Developer account): set the repository secrets
#   APPLE_TEAM_ID               10-character team ID
#   ASC_KEY_ID, ASC_ISSUER_ID   App Store Connect API key (Users and Access > Integrations)
#   ASC_KEY_P8                  contents of the AuthKey_XXXX.p8 file
# Xcode then signs automatically (app.diddy.ios).
#
# A desktop release tag (v*) calls this workflow from release.yml, which attaches the IPA to the
# desktop release. The `release` job below only serves ios-v* tags and manual runs.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      export_method:
        description: "Export method (only used when the signing secrets are set)"
        type: choice
        options:
          - release-testing
          - debugging
          - app-store-connect
        default: release-testing
      release_tag:
        description: "Publish the IPA as a GitHub release with this new tag, e.g. ios-v1.1.0-beta.1 (empty: artifact only)"
        type: string
        default: ""
  push:
    # Default-branch dependency caches can be reused by PR and tag builds.
    branches: [main]
    paths:
      - "ios/project.yml"
      - "ios/Package.resolved"
      - ".github/workflows/ios.yml"
    tags:
      # iOS-only releases: builds the IPA and publishes it as a GitHub release (pre-release while
      # the tag contains "beta"/"alpha"/"rc"). Desktop v* tags are left to release.yml, and an iOS
      # release is never marked "Latest", so releases/latest keeps pointing at the desktop builds.
      - "ios-v*"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

# A new PR revision supersedes the old archive. Tags/manual releases never cancel one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    # The build only reads the repository; publishing happens in the separate `release` job.
    permissions:
      contents: read
    outputs:
      signed: ${{ steps.toolchain.outputs.signed }}
      xcode: ${{ steps.toolchain.outputs.xcode }}
      sdk: ${{ steps.toolchain.outputs.sdk }}
    env:
      SIGNED: ${{ secrets.APPLE_TEAM_ID != '' && secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_KEY_P8 != '' }}
    defaults:
      run:
        working-directory: ios
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select newest Xcode
        id: toolchain
        # Whole-screen sharing without an extension (ScreenCaptureKit on iOS) is only compiled into
        # LiveKit with the iOS 27 SDK, so use the newest Xcode the runner has.
        run: |
          newest=$(printf '%s\n' /Applications/Xcode_*.app | grep -E 'Xcode_[0-9.]+\.app$' | sort -V | tail -n 1)
          sudo xcode-select -s "$newest"
          xcodebuild -version && swift --version
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK $sdk"
          {
            echo "xcode=$(xcodebuild -version | head -n 1)"
            echo "sdk=$sdk"
            echo "cache-key=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)"
            echo "signed=$SIGNED"
          } >> "$GITHUB_OUTPUT"
          if [ "${sdk%%.*}" -lt 27 ]; then
            echo "::warning::iOS SDK $sdk: screen sharing will only cover the Diddy app itself, even on iOS 27 devices. Needs Xcode 27."
          fi

      - name: Check emoji reaction rules
        run: |
          swiftc -swift-version 5 Diddy/Matrix/ReactionEmoji.swift Tools/reaction_check/main.swift -o "$RUNNER_TEMP/diddy-reaction-check"
          "$RUNNER_TEMP/diddy-reaction-check"

      - name: Check stream zoom rules
        run: |
          swiftc -swift-version 5 Diddy/Call/StreamZoom.swift Tools/streamzoom_check/main.swift -o "$RUNNER_TEMP/diddy-streamzoom-check"
          "$RUNNER_TEMP/diddy-streamzoom-check"

      - name: Check avatar choice rules
        run: |
          swiftc -swift-version 5 Diddy/Matrix/AvatarChoice.swift Tools/avatar_check/main.swift -o "$RUNNER_TEMP/diddy-avatar-check"
          "$RUNNER_TEMP/diddy-avatar-check"

      - name: Check presence rules
        run: |
          swiftc -swift-version 5 Diddy/Matrix/PresenceLogic.swift Tools/presence_check/main.swift -o "$RUNNER_TEMP/diddy-presence-check"
          "$RUNNER_TEMP/diddy-presence-check"

      - name: Check profile decor rules
        run: |
          swiftc -swift-version 5 Diddy/Matrix/DiddyProfileDecor.swift Tools/profiledecor_check/main.swift -o "$RUNNER_TEMP/diddy-profiledecor-check"
          "$RUNNER_TEMP/diddy-profiledecor-check"

      - name: Check swipe to reply rules
        run: |
          swiftc -swift-version 5 Diddy/UI/SwipeReplyMath.swift Tools/swipereply_check/main.swift -o "$RUNNER_TEMP/diddy-swipereply-check"
          "$RUNNER_TEMP/diddy-swipereply-check"

      - name: Check timeline layout rules
        run: |
          swiftc -swift-version 5 Diddy/Matrix/TimelineLayout.swift Tools/timeline_check/main.swift -o "$RUNNER_TEMP/diddy-timeline-check"
          "$RUNNER_TEMP/diddy-timeline-check"

      - name: Check profile editor rules
        run: |
          swiftc -swift-version 5 Diddy/Matrix/DiddyProfileDecor.swift Diddy/Matrix/DiddyProfileDraft.swift Tools/profile_editor_check/main.swift -o "$RUNNER_TEMP/diddy-profile-editor-check"
          "$RUNNER_TEMP/diddy-profile-editor-check"

      - name: Check appearance rules
        run: |
          swiftc -swift-version 5 Diddy/App/AppearanceLogic.swift Tools/appearance_check/main.swift -o "$RUNNER_TEMP/diddy-appearance-check"
          "$RUNNER_TEMP/diddy-appearance-check"

      - name: Check bot card rules
        run: |
          swiftc -swift-version 5 Diddy/Matrix/BotCard.swift Tools/botcard_check/main.swift -o "$RUNNER_TEMP/diddy-botcard-check"
          "$RUNNER_TEMP/diddy-botcard-check"

      - name: Check composer rules
        run: |
          swiftc -swift-version 5 Diddy/Matrix/DesktopMarkdown.swift Diddy/Matrix/EmojiData.swift Diddy/Matrix/ComposerLogic.swift Tools/composer_check/main.swift -o "$RUNNER_TEMP/diddy-composer-check"
          "$RUNNER_TEMP/diddy-composer-check"

      - name: Check date format rules
        run: |
          swiftc -swift-version 5 Diddy/App/DateFormatRules.swift Tools/dateformat_check/main.swift -o "$RUNNER_TEMP/diddy-dateformat-check"
          "$RUNNER_TEMP/diddy-dateformat-check"

      - name: Check Do Not Disturb rules
        run: |
          swiftc -swift-version 5 Diddy/Matrix/DoNotDisturb.swift Tools/dnd_check/main.swift -o "$RUNNER_TEMP/diddy-dnd-check"
          "$RUNNER_TEMP/diddy-dnd-check"

      - name: Check message search rules
        run: |
          swiftc -swift-version 5 Diddy/Matrix/MessageSearchLogic.swift Tools/messagesearch_check/main.swift -o "$RUNNER_TEMP/diddy-messagesearch-check"
          "$RUNNER_TEMP/diddy-messagesearch-check"

      - name: Check Ogg/Opus voice message decoding
        run: |
          swiftc -swift-version 5 Diddy/Matrix/OpusContainer.swift Diddy/Matrix/OpusCAFWriter.swift Tools/oggopus_check/main.swift -o "$RUNNER_TEMP/diddy-oggopus-check"
          "$RUNNER_TEMP/diddy-oggopus-check"

      - name: Check notification rule logic
        run: |
          swiftc -swift-version 5 Diddy/Matrix/PushRuleLogic.swift Tools/pushrules_check/main.swift -o "$RUNNER_TEMP/diddy-pushrules-check"
          "$RUNNER_TEMP/diddy-pushrules-check"

      - name: Check quick switcher rules
        run: |
          swiftc -swift-version 5 Diddy/Matrix/QuickSwitchLogic.swift Tools/quickswitch_check/main.swift -o "$RUNNER_TEMP/diddy-quickswitch-check"
          "$RUNNER_TEMP/diddy-quickswitch-check"

      - name: Check room list and server rail rules
        run: |
          swiftc -swift-version 5 Diddy/Matrix/RoomListLogic.swift Tools/roomlist_check/main.swift -o "$RUNNER_TEMP/diddy-roomlist-check"
          "$RUNNER_TEMP/diddy-roomlist-check"

      - name: Check room settings rules
        run: |
          swiftc -swift-version 5 Diddy/Matrix/RoomSettingsLogic.swift Tools/roomsettings_check/main.swift -o "$RUNNER_TEMP/diddy-roomsettings-check"
          "$RUNNER_TEMP/diddy-roomsettings-check"

      - name: Check security and device rules
        run: |
          swiftc -swift-version 5 Diddy/Matrix/SecurityLogic.swift Tools/security_check/main.swift -o "$RUNNER_TEMP/diddy-security-check"
          "$RUNNER_TEMP/diddy-security-check"

      - name: Check app shell rules
        run: |
          swiftc -swift-version 5 Diddy/App/ShellLogic.swift Tools/shell_check/main.swift -o "$RUNNER_TEMP/diddy-shell-check"
          "$RUNNER_TEMP/diddy-shell-check"

      - name: Check timeline navigation rules
        run: |
          swiftc -swift-version 5 Diddy/Matrix/TimelineNavLogic.swift Tools/timelinenav_check/main.swift -o "$RUNNER_TEMP/diddy-timelinenav-check"
          "$RUNNER_TEMP/diddy-timelinenav-check"

      - name: Check homeserver timeout rules
        run: |
          swiftc -swift-version 5 Diddy/Matrix/HomeserverTimeout.swift Tools/timeout_check/main.swift -o "$RUNNER_TEMP/diddy-timeout-check"
          "$RUNNER_TEMP/diddy-timeout-check"

      - name: Check watch together rules
        run: |
          swiftc -swift-version 5 Diddy/Call/WatchTogetherLogic.swift Tools/watchtogether_check/main.swift -o "$RUNNER_TEMP/diddy-watchtogether-check"
          "$RUNNER_TEMP/diddy-watchtogether-check"

      - name: Check call audio rules
        run: |
          swiftc -swift-version 5 Diddy/Call/CallAudioLogic.swift Diddy/Call/CallVolumeMemory.swift Diddy/Call/CallReactionLogic.swift Diddy/Call/AgentVoice.swift Tools/call_audio_check/main.swift -o "$RUNNER_TEMP/diddy-call-audio-check"
          "$RUNNER_TEMP/diddy-call-audio-check"

      - name: Check rich text and message embed rules
        run: |
          swiftc -swift-version 5 Diddy/Matrix/RichText.swift Diddy/Matrix/MessageEmbeds.swift Tools/richtext_check/main.swift -o "$RUNNER_TEMP/diddy-richtext-check"
          "$RUNNER_TEMP/diddy-richtext-check"

      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen

      - name: Generate Xcode project
        env:
          DIDDY_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: xcodegen generate

      - name: Restore pinned Swift dependency resolution
        run: |
          mkdir -p Diddy.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp Package.resolved Diddy.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Cache Xcode and Swift packages
        uses: irgaly/xcode-cache@4141f139f00e335c6e1031fb93e667181f86146f # v1
        with:
          key: xcode-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cache-key }}-${{ env.SIGNED }}-${{ hashFiles('ios/Package.resolved', 'ios/project.yml') }}-${{ github.sha }}
          restore-keys: xcode-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cache-key }}-${{ env.SIGNED }}-${{ hashFiles('ios/Package.resolved', 'ios/project.yml') }}-
          deriveddata-directory: ${{ github.workspace }}/ios/build/DerivedData
          sourcepackages-directory: ${{ github.workspace }}/ios/build/spm
          swiftpm-package-resolved-file: ios/Package.resolved
          swiftpm-cache-key: spm-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cache-key }}-${{ hashFiles('ios/Package.resolved') }}
          restore-mtime-targets: |
            ios/**/*.pbxproj
            ios/project.yml

      - name: Resolve Swift packages from lockfile
        run: |
          xcodebuild -resolvePackageDependencies -project Diddy.xcodeproj -scheme Diddy \
            -clonedSourcePackagesDirPath build/spm -onlyUsePackageVersionsFromResolvedFile
          cmp Package.resolved Diddy.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Build unsigned archive
        if: env.SIGNED != 'true'
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Diddy.xcodeproj -scheme Diddy -configuration Release \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath build/spm \
            -derivedDataPath build/DerivedData -disableAutomaticPackageResolution \
            -showBuildTimingSummary \
            -archivePath build/Diddy.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build/xcodebuild.log | grep -E "error:|warning: .*deprecated|\*\* (ARCHIVE|BUILD)|Build Timing Summary" || {
              status=("${PIPESTATUS[@]}")
              [ "${status[0]}" -eq 0 ] && [ "${status[1]}" -eq 0 ] || exit 1
            }
          test -d build/Diddy.xcarchive/Products/Applications/Diddy.app || {
            echo "::error::Archive failed"; grep -E "error:" build/xcodebuild.log | sort -u | head -n 80; exit 1; }

      - name: Package unsigned IPA
        if: env.SIGNED != 'true'
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' build/Diddy.xcarchive/Products/Applications/Diddy.app/Info.plist)
          rm -rf build/ipa && mkdir -p build/ipa/Payload dist
          cp -R build/Diddy.xcarchive/Products/Applications/Diddy.app build/ipa/Payload/
          (cd build/ipa && zip -qry "../../dist/Diddy_${version}_iOS_unsigned.ipa" Payload)

      - name: Build signed IPA
        if: env.SIGNED == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPORT_METHOD: ${{ inputs.export_method || 'release-testing' }}
        run: |
          set -o pipefail
          key="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_P8" > "$key"
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$key" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild archive \
            -project Diddy.xcodeproj -scheme Diddy -configuration Release \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath build/spm \
            -derivedDataPath build/DerivedData -disableAutomaticPackageResolution \
            -showBuildTimingSummary \
            -archivePath build/Diddy.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" "${auth[@]}" | tee build/xcodebuild.log | grep -E "error:|\*\* ARCHIVE|Build Timing Summary" || {
              status=("${PIPESTATUS[@]}")
              [ "${status[0]}" -eq 0 ] && [ "${status[1]}" -eq 0 ] || exit 1
            }
          test -d build/Diddy.xcarchive || { grep -E "error:" build/xcodebuild.log | sort -u | head -n 80; exit 1; }
          /usr/libexec/PlistBuddy -c "Add :method string $EXPORT_METHOD" -c "Add :teamID string $APPLE_TEAM_ID" -c "Add :signingStyle string automatic" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath build/Diddy.xcarchive -exportPath build/export \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" "${auth[@]}"
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' build/Diddy.xcarchive/Products/Applications/Diddy.app/Info.plist)
          mkdir -p dist && cp build/export/*.ipa "dist/Diddy_${version}_iOS.ipa"

      - name: Check IPA contents
        # A dynamic framework the binaries link against but that is missing from the IPA makes the
        # app crash at launch, so fail the build instead.
        run: |
          ls -la dist
          rm -rf build/check && mkdir -p build/check && unzip -q dist/*.ipa -d build/check
          app=build/check/Payload/Diddy.app
          plutil -lint "$app/PrivacyInfo.xcprivacy"
          ls "$app/Frameworks"
          # Every extension would need its own App ID when sideloading.
          if [ -d "$app/PlugIns" ] || [ -d "$app/Extensions" ]; then
            echo "::error::The IPA contains app extensions:"; ls "$app/PlugIns" "$app/Extensions" 2>/dev/null; exit 1
          fi
          missing=0
          for binary in "$app/Diddy" "$app"/Frameworks/*.framework/*; do
            if [ ! -f "$binary" ] || ! file "$binary" | grep -q Mach-O; then
              continue
            fi
            for lib in $(otool -L "$binary" | awk '/@rpath\//{print $1}'); do
              name=${lib#@rpath/}
              if [ ! -e "$app/Frameworks/$name" ]; then
                echo "::error::$(basename "$binary") links $lib, which is not in the IPA"; missing=1
              fi
            done
          done
          exit $missing

      - name: Upload IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diddy-ios
          path: ios/dist/*.ipa
          if-no-files-found: error

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcodebuild-log
          path: ios/build/xcodebuild.log
          if-no-files-found: ignore

  release:
    # Only for ios-v* tags or a manual run with release_tag. Gets the IPA from the build job's
    # artifact, so the job that runs third-party build code never holds a write token.
    needs: ios
    if: startsWith(github.ref, 'refs/tags/ios-v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download IPA
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: diddy-ios
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
          SIGNED: ${{ needs.ios.outputs.signed }}
          XCODE_VERSION: ${{ needs.ios.outputs.xcode }}
          SDK_VERSION: ${{ needs.ios.outputs.sdk }}
        run: |
          case "$TAG" in ios-v*) ;; *) echo "::error::Release tags must start with ios-v"; exit 1 ;; esac
          ls -la dist
          flags=()
          case "$TAG" in *alpha*|*beta*|*rc*) flags+=(--prerelease) ;; esac
          if [ "$SIGNED" = "true" ]; then
            install="Signed IPA: installs directly on the devices in the provisioning profile."
          else
            install="Unsigned IPA: install it with AltStore, SideStore or Sideloadly, which sign it with your Apple ID. A free Apple ID works; the app has no extensions and uses a single App ID."
          fi
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          Native iPhone/iPad app (SwiftUI, matrix-rust-sdk, LiveKit), built from ${GITHUB_SHA:0:7}.

          $install

          Needs iOS 16 or newer. Your homeserver needs Simplified Sliding Sync (MSC4186); voice channels need a MatrixRTC/LiveKit backend, the same one desktop calls use. See ios/README.md.

          Built with $XCODE_VERSION, iOS SDK $SDK_VERSION.
          NOTES
          # --target creates the tag on the built commit when it does not exist yet (manual runs).
          # --latest=false: the repository's "Latest release" (releases/latest, the desktop download
          # link) must stay on the desktop builds.
          gh release create "$TAG" dist/*.ipa --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Diddy iOS ${TAG#ios-v}" --notes-file "$RUNNER_TEMP/notes.md" --latest=false "${flags[@]}"
