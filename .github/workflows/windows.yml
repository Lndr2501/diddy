name: Windows
# Builds and tests the Windows installer (Electron, NSIS, x64) and stores it as artifact
# `diddy-windows`. A version tag is built and published by release.yml, which calls this workflow.
#
# The frontend is built on Linux (same build as the Linux packages) and handed to the Windows job,
# which only packages the Electron shell around it, runs its tests and starts the packaged app once.
# The installer is not code-signed: Windows SmartScreen asks once ("More info" > "Run anyway").
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths: ["electron/**", "cinny/**", "config.json", ".github/workflows/windows.yml"]
  push:
    branches: [main]
    paths: ["electron/**", "cinny/**", "config.json", ".github/workflows/windows.yml", ".github/scripts/stamp-version.sh"]
# Own group name: as a called workflow github.workflow is the caller's name, and the release
# workflow's other jobs must not cancel this one. Tag runs are never cancelled.
concurrency:
  group: windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: cinny/package-lock.json
      - name: Show the tag version in the app
        run: .github/scripts/stamp-version.sh
      - name: Build frontend
        env:
          NODE_OPTIONS: --max_old_space_size=4096
        run: |
          cp config.json cinny/config.json
          cd cinny
          npm ci --no-audit --no-fund
          npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-frontend
          path: cinny/dist
          if-no-files-found: error
          retention-days: 1

  package:
    needs: frontend
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      HUSKY: "0"
    defaults:
      run:
        shell: bash
    steps:
      # Same line endings as on Linux: the tests read sources and match them line by line.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-frontend
          path: cinny/dist
      - name: Cache the system-audio helper's Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: electron/native/windows-audio -> target
          key: windows-audio
      - name: Install Electron and packaging dependencies
        run: cd electron && npm ci --no-audit --no-fund
      - name: Run Electron tests
        run: cd electron && npm test
      # The system-audio helper (Rust, process loopback); dist:win builds and packages it.
      - name: Check the system-audio helper
        run: |
          rustup show active-toolchain
          cd electron/native/windows-audio
          cargo test --locked
      - name: Build the installer
        run: |
          cd electron
          npm run dist:win
          ls -l dist native/bin
      - name: Check the installer and the packaged app
        run: |
          version=$(node -p "require('./electron/package.json').version")
          test -s "electron/dist/Diddy_${version}_x64-setup.exe"
          test -s electron/dist/win-unpacked/Diddy.exe
          test -s electron/dist/win-unpacked/resources/app.asar
          test -s electron/dist/win-unpacked/resources/frontend/index.html
          test -s electron/dist/win-unpacked/resources/app-icons/pink.png
          # the Linux capture helpers are not part of the Windows build, the Windows one is. Exact
          # names from the directory listing: Git Bash's `test -e x` also matches `x.exe`.
          ls electron/dist/win-unpacked/resources
          if ls electron/dist/win-unpacked/resources | grep -qxE 'diddy-system-audio|diddy-global-shortcut'; then exit 1; fi
          test -s electron/dist/win-unpacked/resources/diddy-system-audio.exe
      - name: Probe the packaged system-audio helper
        run: |
          # Process loopback needs the Windows audio service; server runners may have it stopped.
          powershell -NoProfile -Command "Get-Service Audiosrv,AudioEndpointBuilder | Format-Table -AutoSize; Set-Service Audiosrv -StartupType Automatic -ErrorAction SilentlyContinue; Start-Service Audiosrv -ErrorAction SilentlyContinue; Get-Service Audiosrv | Format-Table -AutoSize" || true
          set +e
          electron/dist/win-unpacked/resources/diddy-system-audio.exe --probe 2> probe.log
          code=$?
          set -e
          cat probe.log
          test "$code" = 0
          grep -qx READY probe.log
          grep -q "probe ok" probe.log
          # without a target the helper refuses to run instead of capturing anything
          if electron/dist/win-unpacked/resources/diddy-system-audio.exe 2>/dev/null; then exit 1; fi
      - name: Start the packaged app once
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright-core@1.65.0
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node electron/tests/start-smoke.cjs electron/dist/win-unpacked/Diddy.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diddy-windows
          path: electron/dist/Diddy_*_x64-setup.exe
          if-no-files-found: error
