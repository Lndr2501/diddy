name: Build
# Builds Diddy for macOS (Apple Silicon) with Tauri and stores the DMG as artifact `diddy-macos`.
# Linux (Electron) packages: linux.yml, iPhone/iPad: ios.yml. GitHub releases: release.yml, which
# calls this workflow on a version tag and publishes the DMG together with all other packages.
#
# macOS signing:
#   - Without secrets the bundle is signed ad hoc (sealed resources, no Developer ID): users run
#     `xattr -cr /Applications/Diddy.app` once.
#   - For a real signature, set the repository secrets
#       APPLE_CERTIFICATE            base64 of the Developer ID Application .p12
#       APPLE_CERTIFICATE_PASSWORD   its password
#       APPLE_SIGNING_IDENTITY       e.g. "Developer ID Application: Name (TEAMID)"
#     and for notarization additionally APPLE_ID, APPLE_PASSWORD (app-specific password),
#     APPLE_TEAM_ID. The workflow then signs and notarizes by itself.
on:
  workflow_dispatch:
    inputs:
      dev:
        description: "Dev build: installs next to the stable app (own name, id and data), never publishes"
        type: boolean
        default: false
  workflow_call:
  push:
    # Seed release dependency caches on the default branch; application-only edits
    # still use the fast Test workflow. Version tags are built by release.yml.
    branches: [main]
    paths:
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "package-lock.json"
      - "cinny/package-lock.json"
      - ".node-version"
      - ".github/workflows/build.yml"
      - ".github/scripts/timestamp-log.py"
      - ".github/scripts/stamp-version.sh"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: macos
            bundles: dmg
            files: |
              src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show the tag version in the app
        run: .github/scripts/stamp-version.sh

      - name: Dev variant (own app name, identifier and data, so the stable app is not replaced)
        if: ${{ inputs.dev }}
        run: |
          cat > "$RUNNER_TEMP/dev.conf.json" <<'JSON'
          {"productName": "Diddy Dev", "mainBinaryName": "diddy-dev", "identifier": "app.diddy.desktop.dev"}
          JSON
          sed -i.bak "s/^export const APP_VERSION = '\(.*\)';/export const APP_VERSION = '\1-dev';/" cinny/src/app/appInfo.ts
          rm -f cinny/src/app/appInfo.ts.bak
          label="${GITHUB_REF_NAME} · $(git rev-parse --short=7 HEAD) · $(date -u '+%Y-%m-%d %H:%M')Z"
          sed -i.bak "s|^export const DEV_BUILD_LABEL = '';|export const DEV_BUILD_LABEL = '${label//|/-}';|" cinny/src/app/appInfo.ts
          rm -f cinny/src/app/appInfo.ts.bak
          grep -n "DEV_BUILD_LABEL =" cinny/src/app/appInfo.ts
          echo "DEV_CONFIG=$RUNNER_TEMP/dev.conf.json" >> "$GITHUB_ENV"

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          package-manager-cache: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
          key: release-${{ runner.arch }}

      - name: Install dependencies
        run: |
          (cd cinny && HUSKY=0 npm ci --no-audit --no-fund)
          npm ci --no-audit --no-fund

      - name: Build
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
          # The secrets are only handed to the macOS job. Empty ones are removed below, because
          # an empty APPLE_CERTIFICATE would make the build try to import an empty certificate.
          APPLE_CERTIFICATE: ${{ matrix.name == 'macos' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.name == 'macos' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.name == 'macos' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ matrix.name == 'macos' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ matrix.name == 'macos' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.name == 'macos' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            # Ad-hoc sign the macOS bundle so its resources are sealed; without it
            # Gatekeeper reports the downloaded app as damaged.
            export APPLE_SIGNING_IDENTITY="-"
          fi
          if [ "${{ matrix.name }}" = "macos" ]; then
            if [ -n "${APPLE_CERTIFICATE:-}" ]; then
              echo "macOS signing: Developer ID certificate${APPLE_ID:+, notarization on}"
            else
              echo "macOS signing: ad hoc (no certificate secrets set)"
            fi
          fi
          set -o pipefail
          npm run tauri -- build --verbose ${DEV_CONFIG:+--config "$DEV_CONFIG"} --bundles ${{ matrix.bundles }} -- --locked --timings 2>&1 \
            | python3 -u .github/scripts/timestamp-log.py \
            | tee "$RUNNER_TEMP/build-${{ matrix.name }}.log"

      - name: Upload build timing diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-timings-${{ matrix.name }}
          path: |
            src-tauri/target/cargo-timings/*.html
            ${{ runner.temp }}/build-${{ matrix.name }}.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diddy-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
