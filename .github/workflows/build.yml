name: Build
# Builds Diddy for macOS (Apple Silicon) and Linux. A tag `vX.Y.Z` also publishes a GitHub release
# with the macOS DMG and SHA256SUMS; the release text comes from the matching section of
# CHANGELOG.md ("## X.Y.Z ...", up to its first "### Stand" subsection). Linux builds stay artifacts only (calls do not work there yet).
#
# macOS signing:
#   - Without secrets the bundle is signed ad hoc (sealed resources, no Developer ID): users run
#     `xattr -cr /Applications/Diddy.app` once.
#   - For a real signature, set the repository secrets
#       APPLE_CERTIFICATE            base64 of the Developer ID Application .p12
#       APPLE_CERTIFICATE_PASSWORD   its password
#       APPLE_SIGNING_IDENTITY       e.g. "Developer ID Application: Name (TEAMID)"
#     and for notarization additionally APPLE_ID, APPLE_PASSWORD (app-specific password),
#     APPLE_TEAM_ID. The workflow then signs and notarizes by itself.
on:
  workflow_dispatch:
  push:
    # Seed release dependency caches on the default branch; application-only edits
    # still use the fast Test workflow. Tag runs keep producing releases as before.
    branches: [main]
    paths:
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "package-lock.json"
      - "cinny/package-lock.json"
      - ".node-version"
      - ".github/workflows/build.yml"
      - ".github/scripts/timestamp-log.py"
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: macos
            bundles: dmg
            files: |
              src-tauri/target/release/bundle/dmg/*.dmg
          - platform: ubuntu-22.04
            name: linux
            bundles: deb,appimage
            files: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ] || [ "$pkg" != "$version" ]; then
            echo "::error::Tag $TAG does not match tauri.conf.json ($version) / package.json ($pkg)"; exit 1
          fi

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          package-manager-cache: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
          key: release-${{ runner.arch }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: |
          (cd cinny && HUSKY=0 npm ci --no-audit --no-fund)
          npm ci --no-audit --no-fund

      - name: Build
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
          # The secrets are only handed to the macOS job. Empty ones are removed below, because
          # an empty APPLE_CERTIFICATE would make the build try to import an empty certificate.
          APPLE_CERTIFICATE: ${{ matrix.name == 'macos' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.name == 'macos' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.name == 'macos' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ matrix.name == 'macos' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ matrix.name == 'macos' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.name == 'macos' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            # Ad-hoc sign the macOS bundle so its resources are sealed; without it
            # Gatekeeper reports the downloaded app as damaged.
            export APPLE_SIGNING_IDENTITY="-"
          fi
          if [ "${{ matrix.name }}" = "macos" ]; then
            if [ -n "${APPLE_CERTIFICATE:-}" ]; then
              echo "macOS signing: Developer ID certificate${APPLE_ID:+, notarization on}"
            else
              echo "macOS signing: ad hoc (no certificate secrets set)"
            fi
          fi
          set -o pipefail
          npm run tauri -- build --verbose --bundles ${{ matrix.bundles }} -- --locked --timings 2>&1 \
            | python3 -u .github/scripts/timestamp-log.py \
            | tee "$RUNNER_TEMP/build-${{ matrix.name }}.log"

      - name: Upload build timing diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-timings-${{ matrix.name }}
          path: |
            src-tauri/target/cargo-timings/*.html
            ${{ runner.temp }}/build-${{ matrix.name }}.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diddy-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    # Only for version tags. The build job (third-party code) has no write access; this job only
    # handles the finished DMG.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      HAVE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAVE_NOTARY: ${{ secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - name: Checkout repository (for CHANGELOG.md)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download macOS DMG
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: diddy-macos
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          # the release text: the CHANGELOG section "## <version> ..." up to the next "## "
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "## " v) == 1) { found = 1; next } }
            /^### Stand/ { if (found) exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/changes.md"
          if [ ! -s "$RUNNER_TEMP/changes.md" ]; then
            echo "::error::No section '## $version' in CHANGELOG.md"; exit 1
          fi
          if [ "$HAVE_CERT" = "true" ] && [ "$HAVE_NOTARY" = "true" ]; then
            install="macOS (Apple Silicon): open the DMG and drag Diddy to Applications. The app is signed with a Developer ID and notarized."
          elif [ "$HAVE_CERT" = "true" ]; then
            install="macOS (Apple Silicon): open the DMG and drag Diddy to Applications. Signed with a Developer ID, not notarized: if macOS blocks it, run \`xattr -cr /Applications/Diddy.app\` once."
          else
            install="macOS (Apple Silicon): open the DMG and drag Diddy to Applications. Ad-hoc signed, not notarized: run \`xattr -cr /Applications/Diddy.app\` once before the first start."
          fi
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          $install

          NOTES
          cat "$RUNNER_TEMP/changes.md" >> "$RUNNER_TEMP/notes.md"
          (cd dist && sha256sum ./*.dmg > SHA256SUMS && cat SHA256SUMS)
          gh release create "$TAG" dist/*.dmg dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "Diddy $version" --notes-file "$RUNNER_TEMP/notes.md"
