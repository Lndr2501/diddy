name: Test
# Typecheck, hardware-free tests (cinny/tests), web build and native Rust tests on every push and pull request.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

# Only a newer run of the same PR/branch supersedes a test run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: "0"

jobs:
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          cache: npm
          cache-dependency-path: cinny/package-lock.json

      - name: Install dependencies
        run: cd cinny && npm ci --no-audit --no-fund

      - name: Typecheck
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
        run: cd cinny && npm run typecheck

      - name: Tests
        run: cd cinny && npm test

      - name: Linux shell tests (Electron main process helpers, no Electron needed)
        run: cd electron && npm test

      - name: Build web app
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
        run: cp config.json cinny/ && cd cinny && npm run build

      - name: Install browser
        run: cd cinny && npx playwright install --with-deps chromium

      - name: Smoke test the login screen
        run: cd cinny && npm run test:e2e

  native:
    # Rust unit tests of the desktop shell (connections, audio bridge, resampler).
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
          key: native-tests-${{ runner.arch }}

      - name: Placeholder web build
        # tauri::generate_context! needs frontendDist at compile time; the tests do not use it.
        run: mkdir -p cinny/dist && echo '<!doctype html>' > cinny/dist/index.html

      - name: Rust tests
        env:
          DYLD_LIBRARY_PATH: /usr/lib/swift
        run: cd src-tauri && cargo test --locked --lib -- --test-threads=1
