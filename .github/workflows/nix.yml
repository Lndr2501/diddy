name: Nix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "electron/**"
      - "cinny/package-lock.json"
      - ".github/workflows/nix.yml"
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "cinny/**"
      - "electron/**"
      - "src-tauri/**"
      - "config.json"
      - ".github/workflows/nix.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 1
            cores = 2

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/**', 'cinny/package-lock.json') }}
          restore-prefixes-first-match: |
            nix-v2-${{ runner.os }}-${{ runner.arch }}-
            nix-v1-${{ runner.os }}-${{ runner.arch }}-
          # Keep build inputs: GC here would discard Node/npm and force redownloads
          # on the next source edit. The immutable key rotates per dependency set.

      - name: Evaluate flake without updating inputs
        run: nix flake check --no-build --no-update-lock-file

      - name: Build Linux package (frontend + Electron shell) and run tests
        run: nix build .#checks.x86_64-linux.package --no-update-lock-file --print-build-logs

      - name: Check installed desktop integration
        run: |
          test -x result/bin/diddy
          test -x result/libexec/diddy-system-audio
          test -s result/share/applications/Diddy.desktop
          test -d result/share/icons/hicolor
          test -s result/share/diddy/electron/main.cjs
          test -s result/share/diddy/frontend/index.html
