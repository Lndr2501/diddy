name: Build Android
# Builds the native Android app (android/, Jetpack Compose + matrix-rust-sdk + LiveKit), runs its
# unit tests and stores the APK as artifact `diddy-android`. Install it on the phone directly
# (allow installing from unknown sources once).
#
# Without secrets the APK is the debug build (app id app.diddy.android.debug). A signed release
# build needs the repository secrets DIDDY_ANDROID_KEYSTORE (base64), DIDDY_ANDROID_KEYSTORE_PASSWORD,
# DIDDY_ANDROID_KEY_ALIAS and DIDDY_ANDROID_KEY_PASSWORD.
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main, "android/**"]
    paths:
      - "android/**"
      - "cinny/public/sound/diddy/**"
      - "cinny/src/app/plugins/builtin/**"
      - "ios/Diddy/Matrix/EmojiData.swift"
      - "fastlane/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "fastlane/**"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HAS_KEYSTORE: ${{ secrets.DIDDY_ANDROID_KEYSTORE != '' && secrets.DIDDY_ANDROID_KEYSTORE_PASSWORD != '' && secrets.DIDDY_ANDROID_KEY_ALIAS != '' && secrets.DIDDY_ANDROID_KEY_PASSWORD != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check release signing
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "$HAS_KEYSTORE" != 'true' ]; then
            echo '::error::Android releases need all four DIDDY_ANDROID signing secrets'
            exit 1
          fi

      - name: Show the tag version in the app
        run: .github/scripts/stamp-version.sh

      - name: Use Java 17
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"

      - name: Point Gradle at the Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        working-directory: android
        run: ./gradlew --no-daemon lintDebug

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-lint
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE: ${{ secrets.DIDDY_ANDROID_KEYSTORE }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/diddy.jks"
          echo "DIDDY_ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/diddy.jks" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        env:
          DIDDY_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.DIDDY_ANDROID_KEYSTORE_PASSWORD }}
          DIDDY_ANDROID_KEY_ALIAS: ${{ secrets.DIDDY_ANDROID_KEY_ALIAS }}
          DIDDY_ANDROID_KEY_PASSWORD: ${{ secrets.DIDDY_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$DIDDY_ANDROID_KEYSTORE_FILE" ]; then
            ./gradlew --no-daemon assembleRelease
            apk=app/build/outputs/apk/release/app-release.apk
            suffix=Android
          else
            ./gradlew --no-daemon assembleDebug
            apk=app/build/outputs/apk/debug/app-debug.apk
            suffix=Android_debug
          fi
          version=$(sed -n 's/^val diddyVersion = "\(.*\)"/\1/p' app/build.gradle.kts)
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$apksigner" verify --verbose "$apk"
          mkdir -p ../dist
          cp "$apk" "../dist/Diddy_${version}_${suffix}.apk"
          ls -la ../dist

      - name: Remove signing key
        if: always() && env.HAS_KEYSTORE == 'true'
        run: rm -f "$RUNNER_TEMP/diddy.jks"

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diddy-android
          path: dist/*.apk
          if-no-files-found: error

  # Starts the app on an emulator: the native Matrix SDK and WebRTC libraries load, the login
  # shows and the Keystore seals secrets (android/app/src/androidTest). Once on the oldest
  # supported Android and once with 16 KB memory pages (Android 15+ devices). Not for release
  # tags, so an emulator hiccup never holds up a release.
  emulator:
    name: Emulator smoke (Android API ${{ matrix.api }}${{ matrix.pages }})
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            target: google_apis
            pages: ""
          - api: 35
            target: google_apis_ps16k
            pages: ", 16 KB pages"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Java 17
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"

      - name: Point Gradle at the Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Allow the emulator to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the app and its tests
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: android
          script: |
            adb shell getconf PAGE_SIZE || echo "getconf is missing on this Android version (4 KB pages)"
            ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-emulator-${{ matrix.api }}
          path: android/app/build/reports/androidTests
          if-no-files-found: ignore

  # F-Droid rebuilds every release from source and ships Diddy's own signed APK only when its build
  # gives the same bytes (android/fdroid/README.md). This builds the unsigned release twice, in two
  # paths, with separate Gradle homes and Gradle on Java 17 and 21, compares both and runs F-Droid's
  # scanner (non-free libraries, trackers). Not for release tags, like the emulator.
  fdroid:
    name: F-Droid (reproducible build, scanner)
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: first

      - name: Second copy in another path
        run: |
          cp -a first "$RUNNER_TEMP/second"
          echo "sdk.dir=$ANDROID_HOME" > first/android/local.properties
          echo "sdk.dir=$ANDROID_HOME" > "$RUNNER_TEMP/second/android/local.properties"

      - name: Release build
        working-directory: first/android
        run: JAVA_HOME="$JAVA_HOME_17_X64" ./gradlew --no-daemon --no-build-cache assembleRelease

      - name: Release build again (other path, Gradle home and JVM)
        working-directory: ${{ runner.temp }}/second/android
        run: |
          JAVA_HOME="$JAVA_HOME_21_X64" GRADLE_USER_HOME="$RUNNER_TEMP/gradle-second" \
            ./gradlew --no-daemon --no-build-cache -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64 assembleRelease

      - name: Compare
        run: |
          python3 first/android/fdroid/compare-apks.py \
            first/android/app/build/outputs/apk/release/app-release-unsigned.apk \
            "$RUNNER_TEMP/second/android/app/build/outputs/apk/release/app-release-unsigned.apk"

      - name: F-Droid scanner
        run: |
          python3 -m venv "$RUNNER_TEMP/fdroidserver"
          "$RUNNER_TEMP/fdroidserver/bin/pip" install --quiet fdroidserver==2.4.5
          "$RUNNER_TEMP/fdroidserver/bin/python" first/android/fdroid/scan.py first

      - name: Upload both APKs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-fdroid-apks
          path: |
            first/android/app/build/outputs/apk/release/app-release-unsigned.apk
            ${{ runner.temp }}/second/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: ignore
