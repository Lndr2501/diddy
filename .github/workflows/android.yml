name: Build Android
# Builds the native Android app (android/, Jetpack Compose + matrix-rust-sdk + LiveKit), runs its
# unit tests and stores the APK as artifact `diddy-android`. Install it on the phone directly
# (allow installing from unknown sources once).
#
# Without secrets the APK is the debug build (app id app.diddy.android.debug). A signed release
# build needs the repository secrets DIDDY_ANDROID_KEYSTORE (base64), DIDDY_ANDROID_KEYSTORE_PASSWORD,
# DIDDY_ANDROID_KEY_ALIAS and DIDDY_ANDROID_KEY_PASSWORD.
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main, "android/**"]
    paths:
      - "android/**"
      - "cinny/public/sound/diddy/**"
      - "cinny/src/app/plugins/builtin/**"
      - "ios/Diddy/Matrix/EmojiData.swift"
      - "fastlane/**"
      - ".github/workflows/android.yml"
      - ".github/scripts/android-emulator-smoke.sh"
  pull_request:
    paths:
      - "android/**"
      - "fastlane/**"
      - ".github/workflows/android.yml"
      - ".github/scripts/android-emulator-smoke.sh"

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HAS_KEYSTORE: ${{ secrets.DIDDY_ANDROID_KEYSTORE != '' && secrets.DIDDY_ANDROID_KEYSTORE_PASSWORD != '' && secrets.DIDDY_ANDROID_KEY_ALIAS != '' && secrets.DIDDY_ANDROID_KEY_PASSWORD != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check release signing
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "$HAS_KEYSTORE" != 'true' ]; then
            echo '::error::Android releases need all four DIDDY_ANDROID signing secrets'
            exit 1
          fi

      - name: Show the tag version in the app
        run: .github/scripts/stamp-version.sh

      - name: Use Java 17
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"

      - name: Point Gradle at the Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      # Dependencies, transforms and the Gradle build cache (org.gradle.caching). Written on main,
      # read by PRs and branches. Release tags build without it, like the npm caches.
      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-disabled: ${{ startsWith(github.ref, 'refs/tags/') }}
          add-job-summary: on-failure

      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest

      - name: Check native APK alignment
        run: |
          python3 .github/scripts/check-android-apk.py android/app/build/outputs/apk/debug/app-debug.apk
          zipalign=$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -n 1)
          "$zipalign" -c -P 16 4 android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload emulator test APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-emulator-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error

      - name: Upload unit and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-checks
          path: |
            android/app/build/test-results/testDebugUnitTest/*.xml
            android/app/build/reports/lint-results-debug.*

      - name: Keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE: ${{ secrets.DIDDY_ANDROID_KEYSTORE }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/diddy.jks"
          echo "DIDDY_ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/diddy.jks" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        env:
          DIDDY_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.DIDDY_ANDROID_KEYSTORE_PASSWORD }}
          DIDDY_ANDROID_KEY_ALIAS: ${{ secrets.DIDDY_ANDROID_KEY_ALIAS }}
          DIDDY_ANDROID_KEY_PASSWORD: ${{ secrets.DIDDY_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$DIDDY_ANDROID_KEYSTORE_FILE" ]; then
            ./gradlew --no-daemon assembleRelease
            apk=app/build/outputs/apk/release/app-release.apk
            suffix=Android
          else
            ./gradlew --no-daemon assembleDebug
            apk=app/build/outputs/apk/debug/app-debug.apk
            suffix=Android_debug
          fi
          version=$(sed -n 's/^val diddyVersion = "\(.*\)"/\1/p' app/build.gradle.kts)
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$apksigner" verify --verbose "$apk"
          mkdir -p ../dist
          cp "$apk" "../dist/Diddy_${version}_${suffix}.apk"
          ls -la ../dist

      - name: Remove signing key
        if: always() && env.HAS_KEYSTORE == 'true'
        run: rm -f "$RUNNER_TEMP/diddy.jks"

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diddy-android
          path: dist/*.apk
          if-no-files-found: error

  emulator:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            target: google_apis
          - api: 35
            target: google_apis_ps16k
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download test APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-emulator-apks
          path: emulator-apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native libraries, encrypted storage and startup
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          # The default AVD RAM let the low-memory killer end Diddy in the foreground on API 35.
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: .github/scripts/android-emulator-smoke.sh
      - name: Upload emulator report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-emulator-${{ matrix.api }}-${{ matrix.target }}
          path: emulator-report/

  # F-Droid rebuilds every release from source and ships Diddy's own signed APK only when its build
  # gives the same bytes (android/fdroid/README.md). These jobs do F-Droid's check: one release
  # build signed by Gradle (throwaway key, like release.yml with the real one), one unsigned build on
  # another runner in another path with Gradle on Java 21, both in parallel and without any cache;
  # then apksigcopier copies the signature over and verifies. Plus F-Droid's scanner (non-free
  # libraries, trackers). Not for release tags.
  fdroid-build:
    name: F-Droid build (${{ matrix.copy }})
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        copy: [signed, unsigned]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: first

      - name: Pick the build path and point Gradle at the Android SDK
        env:
          COPY: ${{ matrix.copy }}
        run: |
          dir="$GITHUB_WORKSPACE/first/android"
          if [ "$COPY" = unsigned ]; then
            cp -a first "$RUNNER_TEMP/second"
            dir="$RUNNER_TEMP/second/android"
          fi
          echo "sdk.dir=$ANDROID_HOME" > "$dir/local.properties"
          echo "ANDROID_DIR=$dir" >> "$GITHUB_ENV"

      - name: Signed release build (throwaway key)
        if: matrix.copy == 'signed'
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          "$JAVA_HOME/bin/keytool" -genkeypair -keystore "$RUNNER_TEMP/throwaway.jks" -storepass throwaway \
            -keypass throwaway -alias throwaway -keyalg RSA -keysize 2048 -validity 1 -dname CN=throwaway
          DIDDY_ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/throwaway.jks" DIDDY_ANDROID_KEYSTORE_PASSWORD=throwaway \
            DIDDY_ANDROID_KEY_ALIAS=throwaway DIDDY_ANDROID_KEY_PASSWORD=throwaway \
            ./gradlew --no-daemon --no-build-cache assembleRelease
          mkdir -p "$RUNNER_TEMP/apk" && cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/apk/"

      - name: Unsigned release build (other path, Gradle home and JVM)
        if: matrix.copy == 'unsigned'
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          JAVA_HOME="$JAVA_HOME_21_X64" GRADLE_USER_HOME="$RUNNER_TEMP/gradle-second" \
            ./gradlew --no-daemon --no-build-cache -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64 assembleRelease
          mkdir -p "$RUNNER_TEMP/apk" && cp app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/apk/"

      - name: Remove the throwaway key
        if: always()
        run: rm -f "$RUNNER_TEMP/throwaway.jks"

      - name: Upload the APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-fdroid-${{ matrix.copy }}
          path: ${{ runner.temp }}/apk/*.apk
          if-no-files-found: error
          retention-days: 3

  fdroid:
    name: F-Droid (reproducible build, scanner)
    needs: fdroid-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: first

      - name: Download both APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: android-fdroid-*
          merge-multiple: true
          path: apks

      - name: F-Droid tools
        run: |
          python3 -m venv "$RUNNER_TEMP/fdroidserver"
          "$RUNNER_TEMP/fdroidserver/bin/pip" install --quiet fdroidserver==2.4.5 apksigcopier==1.1.1
          echo "$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)" >> "$GITHUB_PATH"

      - name: Compare like F-Droid
        run: |
          signed=apks/app-release.apk
          unsigned=apks/app-release-unsigned.apk
          if ! "$RUNNER_TEMP/fdroidserver/bin/apksigcopier" compare "$signed" --unsigned "$unsigned"; then
            python3 first/android/fdroid/compare-apks.py "$signed" "$unsigned" || true
            exit 1
          fi
          echo "reproducible: the signature of the Gradle-signed APK fits the second build"

      - name: F-Droid scanner
        run: |
          mkdir -p first/android/app/build/outputs/apk/release
          cp apks/app-release-unsigned.apk first/android/app/build/outputs/apk/release/
          "$RUNNER_TEMP/fdroidserver/bin/python" first/android/fdroid/scan.py first
