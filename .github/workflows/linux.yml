name: Linux
on:
  workflow_dispatch:
  pull_request:
    paths: ["electron/**", "cinny/**", "config.json", ".github/workflows/linux.yml"]
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["electron/**", "cinny/**", "config.json", ".github/workflows/linux.yml"]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            cinny/package-lock.json
            electron/package-lock.json
      - name: Install native capture and sound-server test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse-dev pulseaudio pulseaudio-utils pipewire pipewire-pulse wireplumber dbus-x11 openbox xvfb xauth libgtk-3-0 libgbm1 libasound2 libasound2-plugins libnss3
      - name: Install frontend and packaging dependencies
        run: |
          (cd cinny && npm ci --no-audit --no-fund)
          (cd electron && npm ci --no-audit --no-fund)
      - name: Compile and test native application audio
        run: |
          (cd electron && npm run build:audio && npm test)
          python3 electron/tests/native-audio.py pulse
          dbus-run-session -- python3 electron/tests/native-audio.py pipewire
      - name: Build frontend and Linux packages
        env:
          NODE_OPTIONS: --max_old_space_size=4096
        run: |
          cp config.json cinny/config.json
          (cd cinny && npm run build)
          (cd electron && npm run dist:linux)
          (cd electron/dist && sha256sum ./*.AppImage ./*.deb > SHA256SUMS)
      - name: Verify packaged capture helper and frontend
        run: |
          test -x electron/dist/linux-unpacked/resources/diddy-system-audio
          test -s electron/dist/linux-unpacked/resources/frontend/index.html
          test -s electron/dist/linux-unpacked/resources/app.asar
          dpkg-deb --info electron/dist/*.deb
      - name: Exercise packaged Electron screen capture and received WebRTC audio
        env:
          DIDDY_TEST_NO_SANDBOX: "1"
        run: timeout 90s xvfb-run -a node electron/tests/desktop-smoke.cjs electron/dist/linux-unpacked/diddy
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diddy-linux
          path: |
            electron/dist/*.AppImage
            electron/dist/*.deb
            electron/dist/SHA256SUMS
          if-no-files-found: error
