name: Linux
# Builds and tests the Linux packages (AppImage, deb, rpm; Electron) and stores them as artifact
# `diddy-linux`. A version tag is built and published by release.yml, which calls this workflow.
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths: ["electron/**", "cinny/**", "config.json", ".github/workflows/linux.yml"]
  push:
    branches: [main]
    paths: ["electron/**", "cinny/**", "config.json", ".github/workflows/linux.yml", ".github/scripts/stamp-version.sh"]
# Own group name: as a called workflow github.workflow is the caller's name, and the release
# workflow's other jobs must not cancel this one. Tag runs are never cancelled.
concurrency:
  group: linux-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            cinny/package-lock.json
            electron/package-lock.json
      - name: Install native capture and sound-server test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libpulse-dev pulseaudio pulseaudio-utils pipewire pipewire-pulse wireplumber dbus-x11 openbox xvfb xauth libgtk-3-0 libgbm1 libasound2 libasound2-plugins libnss3
      - name: Install frontend and packaging dependencies
        run: |
          (cd cinny && npm ci --no-audit --no-fund)
          (cd electron && npm ci --no-audit --no-fund)
      - name: Compile and test native application audio
        run: |
          (cd electron && npm run build:audio && npm test)
          python3 electron/tests/native-audio.py pulse
          dbus-run-session -- python3 electron/tests/native-audio.py pipewire
      - name: Show the tag version in the app
        run: .github/scripts/stamp-version.sh
      - name: Build frontend and Linux packages
        env:
          NODE_OPTIONS: --max_old_space_size=4096
        run: |
          cp config.json cinny/config.json
          (cd cinny && npm run build)
          (cd electron && npm run dist:linux)
          ls -l electron/dist
      - name: Verify packaged capture helper and frontend
        run: |
          test -x electron/dist/linux-unpacked/resources/diddy-system-audio
          test -s electron/dist/linux-unpacked/resources/frontend/index.html
          test -s electron/dist/linux-unpacked/resources/app.asar
          dpkg-deb --info electron/dist/*.deb
          rpm -qpi electron/dist/*.rpm
          # AppImage: ELF runtime with an embedded squashfs, named with version and architecture
          file electron/dist/*.AppImage | grep -q ELF
          for f in electron/dist/Diddy_*_x86_64.AppImage electron/dist/Diddy_*_amd64.deb electron/dist/Diddy_*_x86_64.rpm; do test -s "$f"; done
      - name: Exercise packaged Electron screen capture and received WebRTC audio
        env:
          DIDDY_TEST_NO_SANDBOX: "1"
        run: timeout 90s xvfb-run -a node electron/tests/desktop-smoke.cjs electron/dist/linux-unpacked/diddy
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diddy-linux
          path: |
            electron/dist/*.AppImage
            electron/dist/*.deb
            electron/dist/*.rpm
          if-no-files-found: error
