# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "diddy"
version = "1.2.0"
description = "Diddy - a Matrix chat client (based on Cinny)"
authors = ["Lndr2501"]
license = "AGPL-3.0-only"
repository = "https://github.com/Lndr2501/diddy"
default-run = "diddy"
edition = "2021"
rust-version = "1.61"

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0.109"
serde = { version = "1.0.193", features = ["derive"] }
tauri = { version = "2.11.2", features = [ "devtools", "image-png"] }
tauri-plugin-localhost = "2.3.2"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-fs = "2.5.1"
tauri-plugin-shell = "2.3.5"
tauri-plugin-http = "2.5.9"
tauri-plugin-process = "2.3.1"
tauri-plugin-os = "2.3.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-dialog = "2.7.1"

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = [ "custom-protocol" ]
# this feature is used used for production builds where `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = [ "tauri/custom-protocol" ]
updater = [ "tauri-plugin-updater" ]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2.3.2"
# Keep the current Tauri 2.11 runtime; newer plugin releases require Tauri 2.12.
tauri-plugin-single-instance = "=2.4.2"
tauri-plugin-updater = { version = "2.10.1", features = ["rustls-tls"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Media capture / WebRTC switches and permission handling of the WebKitGTK view (same crate as wry).
webkit2gtk = { version = "2.0", features = ["v2_40"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-web-kit = { version = "0.3", features = ["WKWebViewConfiguration", "WKPreferences", "WKWebsiteDataStore", "block2"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSResponder", "NSWorkspace"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSDate", "NSDictionary", "NSObject", "NSSet", "NSString", "NSUUID", "NSValue"] }
block2 = "0.6"
# System-audio bridge for screen sharing (capture: src/audio_tap.rs, Core Audio process tap)
tungstenite = "0.30"

[target.'cfg(target_os = "macos")'.dev-dependencies]
# tests/webkit_isolation.rs: cookies in real persistent WebKit stores (issue #7)
objc2-web-kit = { version = "0.3", features = ["WKHTTPCookieStore"] }
objc2-foundation = { version = "0.3", features = ["NSError", "NSHTTPCookie", "NSRunLoop"] }

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# WebKit has to run on the main thread, which libtest does not give a test: own main().
[[test]]
name = "webkit_isolation"
harness = false
