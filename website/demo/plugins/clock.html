<!DOCTYPE html>
<!--
  Diddy built-in plugin: clock with date and an optional second time zone.
  Self-contained, offline. Plugin API: docs/plugins.md (apiVersion 1, storage extension).
  Stored keys: "zone" (IANA name from the fixed list below, "" = none).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Clock</title>
    <style>
      :root { --fg: #1d1d1f; --muted: rgba(0, 0, 0, 0.55); --card: rgba(0, 0, 0, 0.05); --line: rgba(0, 0, 0, 0.1); --accent: #007aff; --error: #d70015; color-scheme: light; }
      :root[data-theme="dark"] { --fg: #f5f5f7; --muted: rgba(255, 255, 255, 0.6); --card: rgba(255, 255, 255, 0.08); --line: rgba(255, 255, 255, 0.14); --accent: #0a84ff; --error: #ff6961; color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: transparent; color: var(--fg); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
      .time { font-size: 44px; font-weight: 200; line-height: 1.05; letter-spacing: -0.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .sec { color: var(--muted); font-size: 0.55em; font-weight: 300; }
      .dp { font-size: 0.5em; font-weight: 400; }
      .date { color: var(--muted); font-size: 13px; margin-top: 2px; }
      .zone { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--card); border-radius: 10px; padding: 6px 8px 6px 4px; }
      select { font: inherit; font-size: 13px; color: inherit; background: transparent; border: 0; border-radius: 6px; padding: 4px 6px; min-width: 0; max-width: 60%; cursor: pointer; }
      .zone-time { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .zone-time b { font-weight: 500; font-size: 15px; }
      .zone-time span { color: var(--muted); font-size: 12px; margin-left: 6px; }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .error { color: var(--error); margin: 0; font-size: 12px; }
      [hidden] { display: none !important; }
      :root[data-layout="compact"] main { padding: 6px 10px; gap: 0; }
      :root[data-layout="compact"] .now { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
      :root[data-layout="compact"] .time { font-size: 22px; font-weight: 300; }
      :root[data-layout="compact"] .sec, :root[data-layout="compact"] .zone { display: none; }
      :root[data-layout="compact"] .date { font-size: 12px; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    </style>
    <style id="diddy-custom-css"></style>
  </head>
  <body>
    <main id="app">
      <div class="now">
        <div class="time" id="time" role="timer" aria-label="Current time">--:--</div>
        <div class="date" id="date"></div>
      </div>
      <div class="zone">
        <select id="zone" aria-label="Second time zone"></select>
        <div class="zone-time" id="zoneTime" aria-live="off"></div>
      </div>
      <p class="error" id="error" role="alert" hidden></p>
    </main>

    <script>
      (() => {
        "use strict";

        const API_VERSION = 1;
        const host = window.parent;
        const embedded = host !== window;
        const root = document.documentElement;
        const $ = (id) => document.getElementById(id);
        const send = (message) => {
          if (embedded) host.postMessage(message, "*");
        };
        let locale = navigator.language || "en";
        root.dataset.theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        root.dataset.layout = "full";

        // ---- storage through Diddy (the sandbox blocks localStorage) ----------------------
        const KEY = /^[a-z0-9_.-]{1,40}$/;
        const waiting = new Map();
        let nextId = 0;
        let initDone;
        const initSeen = new Promise((resolve) => (initDone = resolve));
        const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
        async function storageGet(key) {
          if (!embedded || !KEY.test(key)) return null;
          await Promise.race([initSeen, delay(1000)]);
          return new Promise((resolve) => {
            const id = `get-${++nextId}`;
            const timer = setTimeout(() => finish(null), 2000);
            function finish(value) {
              clearTimeout(timer);
              waiting.delete(id);
              resolve(value);
            }
            waiting.set(id, { key, finish });
            send({ type: "diddy:storage:get", id, key });
          });
        }
        function storageSet(key, value) {
          if (!KEY.test(key) || typeof value !== "string" || value.length > 20000) return;
          send({ type: "diddy:storage:set", key, value });
        }

        window.addEventListener("message", (event) => {
          if (!embedded || event.source !== host) return;
          const data = event.data;
          if (!data || typeof data !== "object") return;
          if (data.type === "diddy:init") {
            if (data.apiVersion !== API_VERSION) return;
            if (data.theme === "light" || data.theme === "dark") root.dataset.theme = data.theme;
            root.dataset.layout = data.layout === "compact" ? "compact" : "full";
            $("diddy-custom-css").textContent = typeof data.customCss === "string" ? data.customCss : "";
            if (typeof data.locale === "string") {
              try {
                locale = Intl.getCanonicalLocales(data.locale)[0] || locale;
              } catch {}
            }
            initDone();
            formats.clear();
            render();
          } else if (data.type === "diddy:storage:value") {
            const entry = typeof data.id === "string" ? waiting.get(data.id) : undefined;
            if (!entry || data.key !== entry.key) return;
            if (data.value !== null && typeof data.value !== "string") return;
            entry.finish(data.value);
          }
        });

        const app = $("app");
        let lastHeight = 0;
        const reportHeight = () => {
          const height = Math.ceil(app.getBoundingClientRect().height);
          if (height !== lastHeight) {
            lastHeight = height;
            send({ type: "diddy:resize", height });
          }
        };
        new ResizeObserver(reportHeight).observe(app);

        // ---- clock ------------------------------------------------------------------------
        const ZONES = [
          ["", "No second zone"],
          ["UTC", "UTC"],
          ["Europe/London", "London"],
          ["Europe/Berlin", "Berlin"],
          ["Europe/Istanbul", "Istanbul"],
          ["Asia/Dubai", "Dubai"],
          ["Asia/Kolkata", "Mumbai"],
          ["Asia/Singapore", "Singapore"],
          ["Asia/Tokyo", "Tokyo"],
          ["Australia/Sydney", "Sydney"],
          ["America/Sao_Paulo", "São Paulo"],
          ["America/New_York", "New York"],
          ["America/Chicago", "Chicago"],
          ["America/Los_Angeles", "Los Angeles"],
        ];
        let zone = "";

        const select = $("zone");
        for (const [value, label] of ZONES) {
          const option = document.createElement("option");
          option.value = value;
          option.textContent = label;
          select.append(option);
        }

        // Intl formatters are cached per locale (cleared on every diddy:init).
        const formats = new Map();
        const fmt = (options) => {
          const id = JSON.stringify(options);
          if (!formats.has(id)) {
            let f;
            try {
              f = new Intl.DateTimeFormat(locale, options);
            } catch {
              f = new Intl.DateTimeFormat("en", options);
            }
            formats.set(id, f);
          }
          return formats.get(id);
        };

        // minutes east of UTC for a zone at a given moment
        const offsetOf = (timeZone, date) => {
          const parts = {};
          for (const p of fmt({ timeZone, hourCycle: "h23", year: "numeric", month: "numeric", day: "numeric", hour: "numeric", minute: "numeric" }).formatToParts(date)) {
            parts[p.type] = p.value;
          }
          const asUtc = Date.UTC(+parts.year, +parts.month - 1, +parts.day, +parts.hour % 24, +parts.minute);
          const ms = date.getTime();
          return Math.round((asUtc - (ms - (ms % 60000))) / 60000);
        };
        const describeDiff = (minutes) => {
          if (minutes === 0) return "same time";
          const sign = minutes > 0 ? "+" : "−";
          const abs = Math.abs(minutes);
          const h = Math.floor(abs / 60);
          const m = abs % 60;
          return `${sign}${h}${m ? `:${String(m).padStart(2, "0")}` : ""} h`;
        };

        function render() {
          const now = new Date();
          const compact = root.dataset.layout === "compact";
          // main time: the seconds (with the separator before them) go into a muted span
          const parts = fmt({ hour: "numeric", minute: "2-digit", second: "2-digit" }).formatToParts(now);
          const nodes = [];
          for (const p of parts) {
            if (p.type === "second") {
              const prev = nodes[nodes.length - 1];
              const span = document.createElement("span");
              span.className = "sec";
              span.textContent = (prev && prev.literal ? nodes.pop().text : "") + p.value;
              nodes.push({ el: span });
            } else if (p.type === "dayPeriod") {
              const span = document.createElement("span");
              span.className = "dp";
              span.textContent = p.value;
              nodes.push({ el: span });
            } else {
              nodes.push({ text: p.value, literal: p.type === "literal" });
            }
          }
          $("time").replaceChildren(...nodes.map((n) => n.el || document.createTextNode(n.text)));
          $("date").textContent = fmt(
            compact
              ? { weekday: "short", day: "numeric", month: "short" }
              : { weekday: "long", day: "numeric", month: "long", year: "numeric" }
          ).format(now);

          const out = $("zoneTime");
          if (!zone) {
            out.replaceChildren();
            return;
          }
          const b = document.createElement("b");
          b.textContent = fmt({ timeZone: zone, hour: "numeric", minute: "2-digit" }).format(now);
          const diff = document.createElement("span");
          let text = describeDiff(offsetOf(zone, now) + now.getTimezoneOffset());
          const otherDay = fmt({ timeZone: zone, weekday: "short" }).format(now);
          if (otherDay !== fmt({ weekday: "short" }).format(now)) text += ` · ${otherDay}`;
          diff.textContent = text;
          out.replaceChildren(b, diff);
        }

        function tick() {
          try {
            render();
            $("error").hidden = true;
          } catch (error) {
            $("error").textContent = "Could not show the time.";
            $("error").hidden = false;
          }
          setTimeout(tick, 1000 - (Date.now() % 1000) + 10);
        }

        select.addEventListener("change", () => {
          zone = ZONES.some(([z]) => z === select.value) ? select.value : "";
          storageSet("zone", zone);
          render();
        });

        // ---- start ------------------------------------------------------------------------
        send({
          type: "diddy:ready",
          apiVersion: API_VERSION,
          manifest: { name: "Clock", description: "Time, date and a second zone", height: 150 },
        });
        tick();
        reportHeight();
        storageGet("zone").then((value) => {
          if (typeof value === "string" && ZONES.some(([z]) => z === value) && select.value === "") {
            zone = value;
            select.value = value;
            render();
          }
        });
      })();
    </script>
  </body>
</html>
