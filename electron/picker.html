<style>
:root { color-scheme: light dark; font: 16px system-ui; } body { margin: 24px; }

button:focus-visible { outline:3px solid #e6007e; } img { width:100%; height:110px; object-fit:contain; }

<h1>Was möchtest du teilen?</h1><p>Wähle einen Bildschirm oder ein Fenster.</p>
