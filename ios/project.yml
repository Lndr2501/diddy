# Native iOS/iPadOS client. Generate the Xcode project with `xcodegen` in this folder
# (the .xcodeproj is not committed), see ios/README.md.
name: Diddy
options:
  bundleIdPrefix: app.diddy
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  MatrixRustSDK:
    url: https://github.com/element-hq/matrix-rust-components-swift
    exactVersion: "26.10.27"
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    exactVersion: "2.18.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ${DIDDY_DEVELOPMENT_TEAM}
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Diddy:
    type: application
    platform: iOS
    sources:
      - path: Diddy
    dependencies:
      - package: MatrixRustSDK
      - package: LiveKit
      - target: DiddyBroadcast
        embed: true
    entitlements:
      path: Diddy/Diddy.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.diddy.ios
    info:
      path: Diddy/Info.plist
      properties:
        CFBundleDisplayName: Diddy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
        # Voice channels keep running with the screen locked or another app in front.
        UIBackgroundModes:
          - audio
          - voip
        NSMicrophoneUsageDescription: Diddy needs the microphone for voice channels.
        NSCameraUsageDescription: Diddy needs the camera for video in voice channels.
        NSPhotoLibraryUsageDescription: Diddy lets you send photos and videos from your library.
        NSPhotoLibraryAddUsageDescription: Diddy saves images from chats to your photo library.
        NSLocalNetworkUsageDescription: Diddy connects to Matrix and voice servers on your network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.diddy.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Home-screen icons the user can switch to in Settings (see AppIconManager.swift).
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Blue AppIcon-Purple AppIcon-Black AppIcon-Magenta
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO

  # ReplayKit broadcast upload extension: captures the whole screen (also outside Diddy) and hands
  # the frames to the app through the shared app group, where LiveKit publishes them.
  DiddyBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: DiddyBroadcast
    dependencies:
      - package: LiveKit
    entitlements:
      path: DiddyBroadcast/DiddyBroadcast.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.diddy.ios
    info:
      path: DiddyBroadcast/Info.plist
      properties:
        CFBundleDisplayName: Diddy Screen Share
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    settings:
      base:
        # LiveKit derives the app group (group.app.diddy.ios) and the extension id from these.
        PRODUCT_BUNDLE_IDENTIFIER: app.diddy.ios.broadcast
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks @executable_path/../../Frameworks
