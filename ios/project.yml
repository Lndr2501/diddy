# Native iOS/iPadOS client: one app target, no extensions, so sideloading with a free Apple ID
# needs a single App ID. Generate the Xcode project with `xcodegen` in this folder
# (the .xcodeproj is not committed), see ios/README.md.
name: Diddy
options:
  bundleIdPrefix: app.diddy
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  MatrixRustSDK:
    url: https://github.com/element-hq/matrix-rust-components-swift
    exactVersion: "26.10.27"
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    exactVersion: "2.18.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ${DIDDY_DEVELOPMENT_TEAM}
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  Diddy:
    type: application
    platform: iOS
    sources:
      - path: Diddy
    dependencies:
      # MatrixRustSDK is a dynamic framework (the Rust core lives in it) and must be copied into
      # the app; CI checks that every @rpath framework is really inside the IPA.
      - package: MatrixRustSDK
        embed: true
      - package: LiveKit
    info:
      path: Diddy/Info.plist
      properties:
        CFBundleDisplayName: Diddy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
        # Voice channels keep running with the screen locked or another app in front. No `voip`:
        # the app uses neither PushKit nor CallKit.
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: Diddy needs the microphone for voice channels.
        NSCameraUsageDescription: Diddy needs the camera for video in voice channels.
        # No photo library keys: PhotosPicker runs out of process and hands over only the picked
        # item, and nothing is saved to the library.
        NSLocalNetworkUsageDescription: Diddy connects to Matrix and voice servers on your network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.diddy.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Home-screen icons the user can switch to in Settings (see AppIconManager.swift).
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Blue AppIcon-Purple AppIcon-Black AppIcon-Magenta
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO
