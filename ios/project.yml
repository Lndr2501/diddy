# Native iOS/iPadOS client: the app and one share extension (DiddyShare, "Diddy" in the share
# sheet). Sideloaders that reuse the app's App ID for extensions (the home server's does) need no
# second one; AltStore/SideStore with a free Apple ID need one more. Generate the Xcode project
# with `xcodegen` in this folder (the .xcodeproj is not committed), see ios/README.md.
name: Diddy
options:
  bundleIdPrefix: app.diddy
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  MatrixRustSDK:
    url: https://github.com/element-hq/matrix-rust-components-swift
    exactVersion: "26.10.27"
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    exactVersion: "2.18.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_OBJC_BRIDGING_HEADER: Diddy/Call/Diddy-Bridging-Header.h
    MARKETING_VERSION: "1.7.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ${DIDDY_DEVELOPMENT_TEAM}
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  Diddy:
    type: application
    platform: iOS
    sources:
      - path: Diddy
      # The desktop sound pack, shared so both apps sound the same (see Diddy/App/Sounds.swift).
      - path: ../cinny/public/sound/diddy
        buildPhase: resources
      # The built-in plugin pages, shared with the desktop (see Diddy/Plugins/PluginStore.swift).
      # A folder reference, so they land in the app as `builtin/<name>.html`.
      - path: ../cinny/src/app/plugins/builtin
        type: folder
        buildPhase: resources
      # RNNoise, optimized in every configuration: it runs on the audio thread during calls.
      - path: Vendor/rnnoise
        excludes:
          - README.md
          - COPYING
          - AUTHORS
        compilerFlags:
          - -O2
          - -w
          - -I$(SRCROOT)/Vendor/rnnoise/include
    dependencies:
      - target: DiddyShare
        embed: true
        codeSign: false
      # MatrixRustSDK is a dynamic framework (the Rust core lives in it) and must be copied into
      # the app; CI checks that every @rpath framework is really inside the IPA.
      - package: MatrixRustSDK
        embed: true
      - package: LiveKit
    info:
      path: Diddy/Info.plist
      properties:
        CFBundleDisplayName: Diddy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # No fixed light/dark style: the app follows the chosen theme (DiddyApp, preferredColorScheme).
        # Voice channels keep running with the screen locked or another app in front. No `voip`:
        # the app uses neither PushKit nor CallKit.
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: Diddy needs the microphone for voice channels and voice messages.
        NSCameraUsageDescription: Diddy needs the camera for video in voice channels.
        NSPhotoLibraryAddUsageDescription: Diddy saves images to your photo library when you choose Save to Photos.
        NSLocalNetworkUsageDescription: Diddy connects to Matrix and voice servers on your network.
        # The share extension opens the app with `diddy://share?...` (App/ShareHandoff.swift).
        CFBundleURLTypes:
          - CFBundleURLName: app.diddy.ios.share
            CFBundleURLSchemes:
              - diddy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.diddy.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Home-screen icons the user can switch to in Settings (see AppIconManager.swift).
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Blue AppIcon-Purple AppIcon-Black AppIcon-Magenta
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO

  # "Diddy" in the share sheet: collects photos, videos, files, links and text (Apple Music lyrics)
  # into the app group and opens the app, which asks for the chat and sends. No Matrix code here.
  DiddyShare:
    type: app-extension
    platform: iOS
    sources:
      - path: DiddyShare
      - path: Diddy/App/ShareHandoff.swift
    info:
      path: DiddyShare/Info.plist
      properties:
        CFBundleDisplayName: Diddy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # Offered for everything: Apple Music's lyrics share uses its own item types, which the
            # usual image/URL/text rules do not match. The extension takes what it can use and logs
            # the types (sideloaded, so App Review's dislike of this rule does not matter).
            NSExtensionActivationRule: TRUEPREDICATE
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.diddy.ios.share
        # Xcode requires it for extensions; the app is opened through the runtime instead
        # (ShareViewController.openApp).
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        # The app's bridging header (RNNoise) has nothing to do here.
        SWIFT_OBJC_BRIDGING_HEADER: ""
